; ============================================================================
; FreeUnitExt - drop-in test scenarios
;
; ALL HOSTS ARE ALLIED so the whole set can be exercised in one game as
; America. Uses only vanilla YR types. Paste into rulesmd.ini (merging with the
; existing sections, do not replace them wholesale).
; Scenario numbers match TESTING.md section 2.
; ============================================================================

; --- 1. Multiple units, one per side -----------------------------------------
[GAPILE]
FreeUnit=E1,E1,E1,E1
FreeUnit.Cell=N,E,S,W
FreeUnit.Facing=S,W,N,E              ; each looks back toward the barracks

; --- 2. Spacing ---------------------------------------------------------------
; Use a unit NO other DLL spawns. E1 was the original choice, but a GiftBox/Host
; setup with [E1]Host.Types=E1 makes GIs self-replicate, so three more vanish
; into the crowd and the test proves nothing.
[GADEPT]
FreeUnit=GGI,GGI,GGI
FreeUnit.Cell=N                      ; all three on the same side...
FreeUnit.Spacing=1                   ; ...with a clear cell between each

; --- 3. Mixed infantry + vehicle, broadcast facing ---------------------------
[GAWEAP]
FreeUnit=E1,MTNK
FreeUnit.Facing=E                     ; single value broadcasts to both
FreeUnit.Cell=SE

; --- 4. Random facing (synced RNG); also hosts the #10 turret subjects -------------------------------------------
[GAOREP]
FreeUnit=MTNK,MTNK
FreeUnit.Cell=S
FreeUnit.Facing=random
FreeUnit.Spacing=1

; --- 5. Harvester mission canary ---------------------------------------------
; Must START HARVESTING, not guarding. Proves we reproduced Antares' fix at
; 0x446E9F, which our takeover bypasses.
; NOTE: vanilla YR already ships [GAREFN]FreeUnit=CMIN — do not add a second
; FreeUnit= line, just the modifier. Its presence is what makes our takeover
; fire here, which is the whole point of this scenario.
[GAREFN]
FreeUnit.Cell=SW

; --- 6. Comes with a real, randomly-adjacent building ------------------------
[GAPOWR]
FreeUnit.Buildings=GAPOWR
FreeUnit.Buildings.Range=3
FreeUnit.Buildings.Cell=E

; --- 7. Limbo prerequisite building ------------------------------------------
; Nothing visible appears. Check the TECH TREE: Barracks-gated units should
; become buildable without a Barracks on the map.
[GATECH]
FreeUnit.Buildings=GAPILE
FreeUnit.Buildings.Limbo=yes

; --- 8. Per-building SeparateAircraft override -------------------------------
; Requires [General]SeparateAircraft=yes (vanilla YR default) to be meaningful.
; AMRADR and GAAIRC are the ONLY two Helipad=yes buildings in vanilla YR, and
; both already ship NumberOfDocks=4. There is no NAHPAD.
; NOTE: stock AMRADR is TechLevel=11, i.e. unbuildable in a normal game, so this
; scenario silently never runs. Lower it while testing.
[AMRADR]
TechLevel=1
SeparateAircraft=no

; --- 9. Numbered pads, one aircraft each -------------------------------------
; The headline request: four aircraft, one per dock.
; .Facing is set explicitly because [General]PoseDir is used RAW as a DirType
; byte (verified: PoseDir() @0x417FD0 returns Rules+0x44 unscaled), so the
; stock PoseDir=2 means DirType 2 (~north), NOT east as its INI comment claims.
[GAAIRC]
; NumberOfDocks=4 is already vanilla; listed here only as a reminder that the
; Types list is capped by it.
SeparateAircraft=no
SeparateAircraft.Types=ORCA,ORCA,ORCA,ORCA
SeparateAircraft.Facing=N,E,S,W

; --- 10. ManualFacing.Turret ---------------------------------------------------
; Aim the TURRET, leaving the hull alone. Speed is deliberately NOT zeroed:
; with the Speed gate removed, ManualFacing= alone is the opt-in, so the Rhino
; keeps Speed=7 and simply stops obeying move clicks. That avoids the war
; factory exit problem entirely. [NAWEAP] above already delivers two free.
; SIDE EFFECT: player-controlled Grizzlies will not move. Remove to undo.
[MTNK]
ManualFacing=yes
ManualFacing.Turret=yes
ManualFacing.ROT=2
; Turret hold is PHOBOS' TurretResponse=, deliberately NOT a FreeUnitExt tag.
; Phobos already owns 0x736B60 and defaults it to 'no' for Speed=0 units, which
; is why an MCV holds its facing while a Speed=7 Grizzly snaps back. Adding our
; own key would duplicate a shipped feature and fight Phobos for the same hook.
TurretResponse=no

; --- ManualFacing (TESTING.md §3) --------------------------------------------
; Use the STARTING MCV, not a factory-built unit.
;
; A Speed=0 vehicle produced by a war factory is unlimboed on the exit cell and
; then needs a move mission to drive clear — with Speed=0 it never leaves, so it
; sits on the exit tile and can block the factory permanently. AMCV exists at
; game launch (it is [VehicleTypes] 1 and the [General]BaseUnit), so there is no
; exit to negotiate and it is testable the moment you load in.
;
; This REPLACES AMCV's stock Speed=4, so your MCV cannot drive — deploy it in
; place. Restore Speed=4 to undo. Note this also immobilises AI Allied MCVs.
[AMCV]
Speed=0
ManualFacing=yes
ManualFacing.ROT=3
